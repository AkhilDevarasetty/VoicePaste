name: Bug report
description: Report a reproducible problem in VoicePaste
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce this issue?
      placeholder: |
        1. Run ...
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4.1

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.11.7

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any useful logs, screenshots, or terminal output.
